<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星象解析站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 版面概念:左側輸入欄 + 右側星盤與分頁解讀,像一張攤開的觀測紀錄 */
:root{
  --bg:#eef1f6; --surface:#fbfcfe; --surface2:#e4e9f2; --ink:#16213a; --muted:#56627f;
  --line:#d0d7e5; --brass:#8f6419; --brass-soft:#f1e5c9; --on-brass:#ffffff;
  --fire:#c4472b; --earth:#5b7f3f; --air:#217f8c; --water:#3d63b0;
  --soft:#2f78b8; --hard:#c4472b; --danger:#b3261e;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1325; --surface:#151d35; --surface2:#1d2744; --ink:#e8ecf6; --muted:#9ba7c6;
    --line:#2a3556; --brass:#e0b563; --brass-soft:#2c2a26; --on-brass:#1a1405;
    --fire:#ff8a68; --earth:#9cc27a; --air:#5cc4d1; --water:#8aa6ff;
    --soft:#6fb4ee; --hard:#ff7f66; --danger:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1325; --surface:#151d35; --surface2:#1d2744; --ink:#e8ecf6; --muted:#9ba7c6;
  --line:#2a3556; --brass:#e0b563; --brass-soft:#2c2a26; --on-brass:#1a1405;
  --fire:#ff8a68; --earth:#9cc27a; --air:#5cc4d1; --water:#8aa6ff;
  --soft:#6fb4ee; --hard:#ff7f66; --danger:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
h1{font-family:var(--font-display);font-size:clamp(26px,5vw,38px);line-height:1.2;margin:0;letter-spacing:.06em}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--muted)}
.ghost:hover{border-color:var(--brass);color:var(--ink)}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-family:var(--font-display);font-size:18px;margin:0 0 12px;letter-spacing:.04em}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.check input{width:auto}
.go{background:var(--brass);color:var(--on-brass);border:0;border-radius:8px;padding:11px 14px;font-weight:700;letter-spacing:.1em}
.go:hover{filter:brightness(1.08)}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin:0}
.hint{font-size:12px;color:var(--muted);margin:0}
.banner{background:var(--brass-soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--ink);margin-bottom:14px}
.who{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-bottom:12px}
.who strong{font-family:var(--font-display);font-size:20px}
.who span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass);font-weight:700}
.chartbox{max-width:620px;margin:0 auto}
.chartbox svg{width:100%;height:auto;display:block}
svg .seg{fill:var(--surface);stroke:var(--line);stroke-width:1}
svg .seg.odd{fill:var(--surface2)}
svg .ring{fill:none;stroke:var(--line);stroke-width:1}
svg .tick{stroke:var(--muted);stroke-width:.7;opacity:.6}
svg .cusp{stroke:var(--line);stroke-width:1}
svg .axis{stroke:var(--brass);stroke-width:2}
svg .hn{fill:var(--muted);font-size:11px;text-anchor:middle;dominant-baseline:central;font-family:var(--font-body)}
svg .sg{font-size:22px;text-anchor:middle;dominant-baseline:central}
svg .pl{font-size:21px;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
svg .rx{font-size:9px;fill:var(--hard);text-anchor:middle;dominant-baseline:central}
svg .conn{stroke:var(--muted);stroke-width:.6;opacity:.5}
svg .pt{stroke:var(--ink);stroke-width:1.2}
svg .lab{fill:var(--brass);font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central;font-family:var(--font-body)}
svg .asp-soft{stroke:var(--soft);stroke-width:1.2;opacity:.75}
svg .asp-hard{stroke:var(--hard);stroke-width:1.2;opacity:.75}
.el-fire{fill:var(--fire);color:var(--fire)} .el-earth{fill:var(--earth);color:var(--earth)}
.el-air{fill:var(--air);color:var(--air)} .el-water{fill:var(--water);color:var(--water)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.08em}
td .g{display:inline-block;width:1.4em;text-align:center;font-size:17px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface)}
.card .k{font-size:12px;color:var(--muted);letter-spacing:.12em}
.card .big{font-family:var(--font-display);font-size:22px;margin:4px 0 8px;display:flex;align-items:center;gap:10px}
.card .big .gl{font-size:30px}
.card p{margin:6px 0 0;font-size:14px}
.card .hs{color:var(--muted);font-size:13px}
.mini{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.mini div{border-left:3px solid var(--brass);padding:2px 0 2px 12px;font-size:14px}
.mini b{font-family:var(--font-display)}
h3{font-family:var(--font-display);font-size:17px;margin:24px 0 10px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:58px minmax(0,1fr) 36px;align-items:center;gap:10px;font-size:14px}
.track{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:currentColor}
.note{font-size:14px;color:var(--ink);margin:8px 0 0}
.asps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.asps li{border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.asps li.soft{border-left:4px solid var(--soft)} .asps li.hard{border-left:4px solid var(--hard)} .asps li.neutral{border-left:4px solid var(--brass)}
.asps .t{font-weight:700}
.asps em{font-style:normal;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.asps p{grid-column:1/-1;margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px}
footer{margin-top:28px;color:var(--muted);font-size:12.5px;line-height:1.7}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .5s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>星象解析站</h1>
      <p class="sub">輸入出生資料,即時排出本命盤與今日行運</p>
    </div>
    <button type="button" class="ghost" id="themeBtn">切換亮 / 暗</button>
  </header>

  <div class="layout">
    <aside class="panel">
      <h2>出生資料</h2>
      <form id="form" novalidate>
        <label>姓名(選填)<input id="name" type="text" value="範例" autocomplete="off"></label>
        <div class="row2">
          <label>出生日期<input id="date" type="date" value="1995-08-20" required></label>
          <label>出生時間<input id="time" type="time" value="14:30"></label>
        </div>
        <label class="check"><input id="unknown" type="checkbox"> 不知道出生時間(不排上升與宮位)</label>
        <label>出生城市
          <select id="city"></select>
        </label>
        <div class="row2">
          <label>緯度(北正)<input id="lat" type="number" step="0.01" value="25.03"></label>
          <label>經度(東正)<input id="lon" type="number" step="0.01" value="121.56"></label>
        </div>
        <label>時區(UTC 偏移,小時)<input id="tz" type="number" step="0.5" value="8"></label>
        <p class="hint">有實施夏令時間的地區,請把時區加 1(例如紐約夏季填 -4)。</p>
        <p class="err" id="err" role="alert"></p>
        <button class="go" type="submit">排盤分析</button>
      </form>
    </aside>

    <main>
      <div class="banner" id="banner">目前顯示的是範例資料,請在左側輸入你的出生資料後按「排盤分析」。</div>
      <div class="who" id="who"></div>

      <div class="tabs" role="tablist" aria-label="分析內容">
        <button role="tab" data-tab="chart" aria-selected="true">星盤</button>
        <button role="tab" data-tab="read" aria-selected="false">解讀</button>
        <button role="tab" data-tab="asp" aria-selected="false">相位</button>
        <button role="tab" data-tab="transit" aria-selected="false">今日行運</button>
      </div>

      <section id="tab-chart" class="tabpanel">
        <div class="chartbox" id="chartbox"></div>
        <div class="legend">
          <span><i style="color:var(--soft)"></i>六分 / 三分(和諧)</span>
          <span><i style="color:var(--hard)"></i>四分 / 對分(緊張)</span>
        </div>
        <h3>行星位置</h3>
        <div class="tblwrap"><table id="ptable"></table></div>
      </section>

      <section id="tab-read" class="tabpanel" hidden>
        <div class="cards" id="core"></div>
        <div class="mini" id="mini"></div>
        <h3>元素與形態分布</h3>
        <div class="bars" id="elbars"></div>
        <p class="note" id="elnote"></p>
        <h3 style="margin-top:20px">形態</h3>
        <div class="bars" id="mdbars"></div>
        <p class="note" id="mdnote"></p>
      </section>

      <section id="tab-asp" class="tabpanel" hidden>
        <div class="sum" id="aspsum"></div>
        <ul class="asps" id="asplist"></ul>
      </section>

      <section id="tab-transit" class="tabpanel" hidden>
        <p class="hint" id="nowlabel"></p>
        <h3 style="margin-top:12px">目前天象</h3>
        <div class="tblwrap"><table id="ntable"></table></div>
        <h3>行運對本命的相位(誤差 2.5° 內)</h3>
        <ul class="asps" id="tlist"></ul>
      </section>
    </main>
  </div>

  <footer>
    行星位置採用低精度解析演算法(通常誤差在 1° 內,月亮略大),宮位為整宮制,北交點為平均交點。
    解讀內容為星座文化的通則,僅供自我探索與娛樂參考,不能取代專業諮詢或重大決策依據。
  </footer>
</div>
