<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匯率換算</title>
<style>
/* 版面：單欄卡片，上方輸入與結果，下方常用幣別對照表 */
:root{
  --bg:#f2f5f3;
  --surface:#ffffff;
  --fg:#16211c;
  --muted:#5b6a63;
  --line:#d9e0dc;
  --accent:#0a6a54;
  --accent-fg:#ffffff;
  --soft:#e2efe9;
  --warn:#8a5a00;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1613;
    --surface:#18211d;
    --fg:#e8efeb;
    --muted:#9aaaa2;
    --line:#2b3732;
    --accent:#4cc9a4;
    --accent-fg:#06241a;
    --soft:#1f3029;
    --warn:#e0b04a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font);
  font-size:16px;
  line-height:1.5;
  padding-block:32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.35rem;margin:0;letter-spacing:.02em}
.sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
label.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap{font-size:.78rem;color:var(--muted);letter-spacing:.06em}
input,select,button{font:inherit;color:inherit}
input#amount{
  width:100%;font-size:1.9rem;font-weight:600;padding:10px 12px;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;
  font-variant-numeric:tabular-nums;
}
select{
  width:100%;min-width:0;padding:11px 10px;background:var(--bg);
  border:1px solid var(--line);border-radius:10px;
}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
#swap{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-size:1.2rem;line-height:1;
}
#swap:hover{background:var(--soft)}
.result{background:var(--soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.result .from{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.result .to{font-size:2.1rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.result .rate{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
h2{font-size:.95rem;margin:0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.76rem;color:var(--muted);font-weight:500;letter-spacing:.05em}
td.num,th.num{text-align:right}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--soft)}
tr.current td{background:var(--soft);font-weight:600}
tr:last-child td{border-bottom:0}
.code{font-weight:600}
.status{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.status span{color:var(--muted);font-size:.85rem}
#refresh{
  background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;
  padding:9px 14px;cursor:pointer;font-weight:600;
}
#refresh[disabled]{opacity:.6;cursor:progress}
#msg{min-height:1.2em;font-size:.85rem;color:var(--warn);margin:0}
.note{color:var(--muted);font-size:.78rem;margin:0}
@media (max-width:420px){
  .pair{grid-template-columns:1fr;}
  #swap{justify-self:center;transform:rotate(90deg)}
  .result .to{font-size:1.7rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>匯率換算</h1>
    <p class="sub">以新台幣為基準，支援 87 種幣別互相換算</p>
  </header>

  <section class="card" aria-label="換算器">
    <label class="field">
      <span class="cap">金額</span>
      <input id="amount" type="text" inputmode="decimal" autocomplete="off" value="1000">
    </label>

    <div class="pair">
      <label class="field">
        <span class="cap">從</span>
        <select id="from"></select>
      </label>
      <button id="swap" type="button" aria-label="互換幣別" title="互換幣別">⇄</button>
      <label class="field">
        <span class="cap">換成</span>
        <select id="to"></select>
      </label>
    </div>

    <div class="result" aria-live="polite">
      <div class="from" id="resFrom"></div>
      <div class="to" id="resTo"></div>
      <div class="rate" id="resRate"></div>
    </div>
  </section>

  <section class="card" aria-label="常用幣別對照">
    <h2>常用幣別對照（點一列可切換目標幣別）</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>幣別</th><th class="num">金額</th><th class="num">1 單位 = </th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section class="card" aria-label="匯率資料">
    <div class="status">
      <span id="stamp"></span>
      <button id="refresh" type="button">更新即時匯率</button>
    </div>
    <p id="msg" role="status"></p>
    <p class="note">匯率為中間價參考值，不是銀行實際買賣價，臨櫃或刷卡請以實際成交價為準。內建匯率為 2026/11/20 的快照，按下更新可嘗試取得最新資料，需要網路連線。</p>
  </section>
</main>

<script>
(function(){
  // 內建匯率：1 TWD 可換得多少該幣別（2026/11/20 快照）
  var SNAPSHOT_LABEL = "內建匯率 · 2026/11/20";
  var BASE = {
    TWD:1,
    BDT:3.7720128, CNY:0.2019321, HKD:0.2375866, IDR:553.54399, INR:2.8254782, JPY:4.8384507,
    KHR:123.40706, KRW:40.417537, LAK:683.33246, LKR:10.086630, MVR:0.4666155, MYR:0.1245024,
    NPR:4.5245117, PHP:1.9350602, PKR:8.3832930, SGD:0.0391181, THB:1.0283646, VND:779.93925,
    BAM:0.0539592, BGN:0.0539564, CHF:0.0255565, CZK:0.6743163, DKK:0.2062040, EUR:0.0275893,
    GBP:0.0231145, HUF:10.295896, ISK:3.7855868, MDL:0.5541178, MKD:1.6982610, NOK:0.2957631,
    PLN:0.1224511, RON:0.1475709, RSD:3.2458844, RUB:2.4887118, SEK:0.3084818, TRY:1.5323140,
    UAH:1.3661987, AWG:0.0545077, BBD:0.0610828, BMD:0.0303827, BSD:0.0303262, CAD:0.0434068,
    DOP:1.8236904, GTQ:0.2317153, JMD:4.7997153, MXN:0.5776515, PAB:0.0303289, USD:0.0302840,
    XCD:0.0819166, AUD:0.0454071, FJD:0.0692547, NZD:0.0551221, XPF:3.2894755, ARS:47.389360,
    BOB:0.3561534, BRL:0.1791518, CLP:30.654778, COP:101.79910, PEN:0.1033802, PYG:190.14564,
    TTD:0.2057888, UYU:1.2312703, AED:0.1112457, BHD:0.0114441, ILS:0.1000803, JOD:0.0214755,
    KWD:0.0094507, OMR:0.0116471, QAR:0.1102470, SAR:0.1136473, BWP:0.4283795, EGP:1.6297292,
    GHS:0.3565093, GMD:2.2269884, KES:3.9455497, MAD:0.3013058, MGA:136.85631, MUR:1.4189191,
    NAD:0.5224812, NGN:40.920214, SCR:0.4238548, TND:0.0918945, UGX:128.42832, XAF:18.097412,
    XOF:18.097412, ZAR:0.5292957
  };
  var FAVS = ["USD","JPY","EUR","CNY","KRW","HKD","GBP","THB","SGD","AUD"];

  var rates = Object.assign({}, BASE);
  var stampText = SNAPSHOT_LABEL;

  var $ = function(id){ return document.getElementById(id); };
  var amountEl = $("amount"), fromEl = $("from"), toEl = $("to");

  var names;
  try { names = new Intl.DisplayNames(["zh-TW"], {type:"currency"}); } catch(e){ names = null; }
  function nameOf(c){
    if (c === "TWD") return "新台幣";
    try { return names ? names.of(c) : c; } catch(e){ return c; }
  }
  function label(c){ return c + " " + nameOf(c); }

  function fmt(n){
    if (!isFinite(n)) return "—";
    var a = Math.abs(n);
    var maxD = a >= 1 ? 2 : (a >= 0.01 ? 4 : 6);
    var minD = a >= 1 ? 2 : 0;
    return n.toLocaleString("zh-TW", {minimumFractionDigits:minD, maximumFractionDigits:maxD});
  }
  function fmtRate(n){
    if (!isFinite(n)) return "—";
    var a = Math.abs(n);
    var d = a >= 100 ? 2 : (a >= 1 ? 4 : (a >= 0.01 ? 5 : 7));
    return n.toLocaleString("zh-TW", {minimumFractionDigits:0, maximumFractionDigits:d});
  }
  function parseAmount(){
    var v = parseFloat(amountEl.value.replace(/[,\s]/g, ""));
    return isFinite(v) ? v : 0;
  }
  function convert(amt, from, to){ return amt / rates[from] * rates[to]; }

  function fillSelects(){
    var codes = Object.keys(rates);
    var rest = codes.filter(function(c){ return c !== "TWD" && FAVS.indexOf(c) < 0; }).sort();
    function group(title, list){
      var g = document.createElement("optgroup");
      g.label = title;
      list.forEach(function(c){
        var o = document.createElement("option");
        o.value = c; o.textContent = label(c);
        g.appendChild(o);
      });
      return g;
    }
    [fromEl, toEl].forEach(function(sel){
      sel.textContent = "";
      sel.appendChild(group("常用", ["TWD"].concat(FAVS.filter(function(c){ return rates[c]; }))));
      sel.appendChild(group("其他", rest));
    });
  }

  function renderRows(){
    var from = fromEl.value, to = toEl.value, amt = parseAmount();
    var body = $("rows");
    body.textContent = "";
    ["TWD"].concat(FAVS).filter(function(c){ return c !== from && rates[c]; }).forEach(function(c){
      var tr = document.createElement("tr");
      tr.className = "pick" + (c === to ? " current" : "");
      tr.tabIndex = 0;
      var t1 = document.createElement("td"); t1.className = "code"; t1.textContent = c + " " + nameOf(c);
      var t2 = document.createElement("td"); t2.className = "num"; t2.textContent = fmt(convert(amt, from, c));
      var t3 = document.createElement("td"); t3.className = "num"; t3.textContent = fmtRate(convert(1, from, c));
      tr.appendChild(t1); tr.appendChild(t2); tr.appendChild(t3);
      function pick(){ toEl.value = c; update(); }
      tr.addEventListener("click", pick);
      tr.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); } });
      body.appendChild(tr);
    });
  }

  function update(){
    var from = fromEl.value, to = toEl.value, amt = parseAmount();
    $("resFrom").textContent = fmt(amt) + " " + nameOf(from) + "（" + from + "）等於";
    $("resTo").textContent = fmt(convert(amt, from, to)) + " " + to;
    $("resRate").textContent = "1 " + from + " = " + fmtRate(convert(1, from, to)) + " " + to +
      "　·　1 " + to + " = " + fmtRate(convert(1, to, from)) + " " + from;
    $("stamp").textContent = "匯率來源：" + stampText;
    renderRows();
    try { localStorage.setItem("fx-pair", JSON.stringify({from:from, to:to, amt:amountEl.value})); } catch(e){}
  }

  amountEl.addEventListener("input", update);
  fromEl.addEventListener("change", update);
  toEl.addEventListener("change", update);
  $("swap").addEventListener("click", function(){
    var t = fromEl.value; fromEl.value = toEl.value; toEl.value = t; update();
  });

  $("refresh").addEventListener("click", function(){
    var btn = $("refresh"), msg = $("msg");
    btn.disabled = true; btn.textContent = "更新中…"; msg.textContent = "";
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 8000);
    fetch("https://open.er-api.com/v6/latest/TWD", {signal:ctrl.signal})
      .then(function(r){ if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function(d){
        if (!d || !d.rates) throw new Error("bad data");
        Object.keys(rates).forEach(function(c){ if (typeof d.rates[c] === "number") rates[c] = d.rates[c]; });
        var when = d.time_last_update_utc ? new Date(d.time_last_update_utc) : new Date();
        stampText = "即時匯率 · " + when.toLocaleString("zh-TW", {hour12:false});
        msg.textContent = "";
        update();
      })
      .catch(function(){
        msg.textContent = "無法取得即時匯率，目前仍使用內建快照。請確認網路連線後再試。";
      })
      .then(function(){
        clearTimeout(timer);
        btn.disabled = false; btn.textContent = "更新即時匯率";
      });
  });

  // 初始化
  fillSelects();
  fromEl.value = "TWD"; toEl.value = "USD";
  try {
    var saved = JSON.parse(localStorage.getItem("fx-pair") || "null");
    if (saved && rates[saved.from] && rates[saved.to]) {
      fromEl.value = saved.from; toEl.value = saved.to;
      if (saved.amt) amountEl.value = saved.amt;
    }
  } catch(e){}
  update();
})();
</script>
</body>
</html>
